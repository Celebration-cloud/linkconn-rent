<body class="bg-background text-on-surface h-full flex flex-col items-center justify-center p-margin-mobile md:p-margin-desktop">
<!-- Main Container -->
<div class="w-full max-w-md bg-surface-container-lowest border border-outline-variant rounded-xl p-stack-lg shadow-[0_4px_20px_rgba(18,55,42,0.08)] flex flex-col gap-stack-lg">
<!-- Header -->
<div class="text-center flex flex-col gap-stack-sm">
<h1 class="font-headline-lg text-headline-lg text-primary">Linkcon Rent</h1>
<h2 class="font-headline-md text-headline-md text-on-surface">Welcome Back</h2>
<p class="font-body-md text-body-md text-on-surface-variant">Sign in to manage your rentals securely.</p>
</div>
<!-- Form -->
<form class="flex flex-col gap-stack-md">
<!-- Email/Phone Input -->
<div class="flex flex-col gap-stack-sm">
<label class="font-label-md text-label-md text-on-surface" for="email_phone">Email or Phone Number</label>
<div class="relative">
<span class="absolute inset-y-0 left-0 flex items-center pl-3 text-on-surface-variant material-symbols-outlined" style="font-variation-settings: 'FILL' 0;">mail</span>
<input class="w-full pl-10 pr-4 py-3 bg-surface-bright border border-outline-variant rounded-lg font-body-md text-body-md text-on-surface focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary transition-colors" id="email_phone" placeholder="Enter your email or phone" type="text"/>
</div>
</div>
<!-- Password Input -->
<div class="flex flex-col gap-stack-sm">
<div class="flex justify-between items-center">
<label class="font-label-md text-label-md text-on-surface" for="password">Password</label>
<a class="font-label-md text-label-md text-primary hover:underline" href="#">Forgot password?</a>
</div>
<div class="relative">
<span class="absolute inset-y-0 left-0 flex items-center pl-3 text-on-surface-variant material-symbols-outlined" style="font-variation-settings: 'FILL' 0;">lock</span>
<input class="w-full pl-10 pr-12 py-3 bg-surface-bright border border-outline-variant rounded-lg font-body-md text-body-md text-on-surface focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary transition-colors" id="password" placeholder="Enter your password" type="password"/>
<button class="absolute inset-y-0 right-0 flex items-center pr-3 text-on-surface-variant hover:text-primary transition-colors" type="button">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 0;">visibility</span>
</button>
</div>
</div>
<!-- Remember Me -->
<div class="flex items-center gap-2 mt-2">
<input class="w-4 h-4 text-primary bg-surface-bright border-outline-variant rounded focus:ring-primary focus:ring-offset-surface-container-lowest" id="remember" type="checkbox"/>
<label class="font-body-md text-body-md text-on-surface-variant cursor-pointer" for="remember">Remember this device</label>
</div>
<!-- Primary Action -->
<button class="w-full py-3 mt-4 bg-primary text-on-primary font-label-md text-label-md rounded-lg hover:bg-primary-container hover:text-on-primary-container transition-colors shadow-sm flex items-center justify-center gap-2" type="submit">
                Sign In
                <span class="material-symbols-outlined text-sm" style="font-variation-settings: 'FILL' 0;">arrow_forward</span>
</button>
</form>
<!-- Divider -->
<div class="flex items-center gap-4">
<div class="flex-1 h-px bg-outline-variant"></div>
<span class="font-caption text-caption text-on-surface-variant uppercase tracking-wider">Or continue with</span>
<div class="flex-1 h-px bg-outline-variant"></div>
</div>
<!-- Secondary Actions -->
<div class="flex flex-col gap-stack-sm">
<button class="w-full py-3 bg-surface-bright border border-outline-variant text-on-surface font-label-md text-label-md rounded-lg hover:bg-surface-variant transition-colors flex items-center justify-center gap-3">

</div>
