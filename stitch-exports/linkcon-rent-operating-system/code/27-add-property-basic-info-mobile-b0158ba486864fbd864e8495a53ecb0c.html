<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Linkcon Rent - Add Property</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "outline": "#6f7a72",
                        "surface-container-high": "#ece8df",
                        "on-secondary": "#ffffff",
                        "on-primary-fixed-variant": "#005236",
                        "on-tertiary-fixed-variant": "#354e00",
                        "primary-fixed": "#a0f4c9",
                        "secondary-container": "#c1e9d5",
                        "surface-container-highest": "#e6e2d9",
                        "secondary-fixed": "#c3ebd8",
                        "on-secondary-fixed": "#002116",
                        "surface-container": "#f1eee5",
                        "on-tertiary-fixed": "#131f00",
                        "background": "#fdf9f0",
                        "tertiary-container": "#537707",
                        "primary-container": "#237a57",
                        "surface-variant": "#e6e2d9",
                        "tertiary": "#3f5d00",
                        "on-tertiary": "#ffffff",
                        "on-tertiary-container": "#d2fe85",
                        "on-surface-variant": "#3f4943",
                        "on-primary-container": "#b1ffd6",
                        "on-primary-fixed": "#002113",
                        "primary-fixed-dim": "#84d7ae",
                        "surface-container-lowest": "#ffffff",
                        "on-primary": "#ffffff",
                        "on-secondary-fixed-variant": "#2a4e3f",
                        "surface-container-low": "#f7f3ea",
                        "on-error": "#ffffff",
                        "inverse-primary": "#84d7ae",
                        "on-error-container": "#93000a",
                        "tertiary-fixed": "#c5f17a",
                        "tertiary-fixed-dim": "#aad461",
                        "surface-dim": "#dddad1",
                        "on-secondary-container": "#466a5b",
                        "error-container": "#ffdad6",
                        "outline-variant": "#bec9c1",
                        "surface": "#fdf9f0",
                        "surface-tint": "#0c6c4a",
                        "error": "#ba1a1a",
                        "secondary-fixed-dim": "#a8cfbd",
                        "inverse-on-surface": "#f4f0e7",
                        "on-surface": "#1c1c16",
                        "surface-bright": "#fdf9f0",
                        "on-background": "#1c1c16",
                        "secondary": "#416656",
                        "inverse-surface": "#31302b",
                        "primary": "#006041"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "stack-sm": "8px",
                        "stack-md": "16px",
                        "stack-lg": "32px",
                        "unit": "8px",
                        "margin-mobile": "20px",
                        "margin-desktop": "40px",
                        "gutter": "24px",
                        "container-max": "1280px"
                    },
                    "fontFamily": {
                        "label-md": ["Manrope"],
                        "display-lg": ["Manrope"],
                        "headline-lg-mobile": ["Manrope"],
                        "headline-md": ["Manrope"],
                        "body-md": ["Manrope"],
                        "price-display": ["Manrope"],
                        "headline-lg": ["Manrope"],
                        "caption": ["Manrope"],
                        "body-lg": ["Manrope"]
                    },
                    "fontSize": {
                        "label-md": ["14px", { "lineHeight": "20px", "letterSpacing": "0.05em", "fontWeight": "600" }],
                        "display-lg": ["48px", { "lineHeight": "56px", "letterSpacing": "-0.02em", "fontWeight": "800" }],
                        "headline-lg-mobile": ["28px", { "lineHeight": "36px", "fontWeight": "700" }],
                        "headline-md": ["24px", { "lineHeight": "32px", "fontWeight": "700" }],
                        "body-md": ["16px", { "lineHeight": "24px", "fontWeight": "400" }],
                        "price-display": ["20px", { "lineHeight": "28px", "fontWeight": "800" }],
                        "headline-lg": ["32px", { "lineHeight": "40px", "letterSpacing": "-0.01em", "fontWeight": "700" }],
                        "caption": ["12px", { "lineHeight": "16px", "fontWeight": "500" }],
                        "body-lg": ["18px", { "lineHeight": "28px", "fontWeight": "400" }]
                    }
                }
            }
        }
    </script>
<style>
        .custom-input:focus-within {
            border-color: theme('colors.primary');
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background text-on-background font-body-md min-h-screen flex flex-col antialiased pb-24">
<!-- Top Navigation Area (Task-Focused - No Global Nav Shell) -->
<header class="sticky top-0 z-50 bg-background/90 backdrop-blur-md px-margin-mobile py-4 flex items-center justify-between">
<button aria-label="Go Back" class="w-10 h-10 flex items-center justify-center rounded-full bg-surface-container-high text-on-surface-variant hover:bg-surface-variant transition-colors">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 0;">close</span>
</button>
<span class="font-headline-md text-headline-md text-on-background">Add Property</span>
<div class="w-10 h-10"></div> <!-- Placeholder for balance -->
</header>
<main class="flex-grow px-margin-mobile flex flex-col gap-stack-lg pt-stack-md">
<!-- Progress Stepper -->
<section aria-label="Progress">
<div class="flex items-center justify-between mb-2">
<span class="font-label-md text-label-md text-primary">Step 1 of 4</span>
<span class="font-caption text-caption text-on-surface-variant">Basic Information</span>
</div>
<div class="flex gap-2 h-2 w-full">
<div class="flex-1 bg-primary rounded-full"></div>
<div class="flex-1 bg-surface-variant rounded-full"></div>
<div class="flex-1 bg-surface-variant rounded-full"></div>
<div class="flex-1 bg-surface-variant rounded-full"></div>
</div>
</section>
<!-- Form Section -->
<section class="flex flex-col gap-stack-lg">
<!-- Map Selection -->
<div class="flex flex-col gap-stack-md">
<label class="font-label-md text-label-md text-on-surface">Property Location</label>
<div class="relative w-full h-48 rounded-xl overflow-hidden border border-outline-variant">
<img alt="Map view" class="w-full h-full object-cover" data-location="Lagos, Nigeria" src="https://lh3.googleusercontent.com/aida-public/AB6AXuDpoOhyDAKXpsJMlTBjK2ei3GeyQ_v9vXP5Mt96Xx7UXoScqrJQVRI-81uLk7O6t37YNPB3ZP4UpehSf3tbfud78lmGN3P6qiPJ94CrLmT1WhY5CDxYaE053i5CqLnxw8ze-J1LwtVbfu8wRKH0mJEa0P6jR5kFPfBVvH1zXWwm-DvKIVDu2iLpkCjMkvCb-laFB_Qg-D1HMf3mA2p12T2_N1A6mscmMUKz3R3NPqqE7FYuOmX6B3ijmg"/>
<div class="absolute inset-0 bg-black/10 flex items-center justify-center pointer-events-none">
<span class="material-symbols-outlined text-error text-4xl drop-shadow-md" style="font-variation-settings: 'FILL' 1;">location_on</span>
</div>
<button class="absolute bottom-4 right-4 bg-surface px-4 py-2 rounded-full font-label-md text-label-md text-primary shadow-sm flex items-center gap-2">
<span class="material-symbols-outlined text-xl">my_location</span> Locate
                    </button>
</div>
</div>
<!-- Address Input -->
<div class="flex flex-col gap-stack-sm">
<label class="font-label-md text-label-md text-on-surface" for="address">Full Address</label>
<div class="flex items-center gap-3 bg-surface border border-outline-variant rounded-lg p-3 custom-input transition-colors">
<span class="material-symbols-outlined text-on-surface-variant">home_pin</span>
<input class="w-full bg-transparent border-none p-0 focus:ring-0 font-body-md text-body-md placeholder:text-on-surface-variant/50 text-on-surface outline-none" id="address" placeholder="e.g. 15 Ikoyi Crescent, Lagos" type="text"/>
</div>
</div>
<!-- Property Type Select -->
<div class="flex flex-col gap-stack-sm">
<label class="font-label-md text-label-md text-on-surface">Property Type</label>
<div class="grid grid-cols-2 gap-3">
<label class="cursor-pointer">
<input checked="" class="peer sr-only" name="property_type" type="radio" value="apartment"/>
<div class="flex flex-col items-center justify-center p-4 rounded-xl border border-outline-variant bg-surface peer-checked:border-primary peer-checked:bg-secondary-container peer-checked:text-on-secondary-container text-on-surface-variant transition-colors">
<span class="material-symbols-outlined mb-2 text-[32px]">apartment</span>
<span class="font-label-md text-label-md">Apartment</span>
</div>
</label>
<label class="cursor-pointer">
<input class="peer sr-only" name="property_type" type="radio" value="duplex"/>
<div class="flex flex-col items-center justify-center p-4 rounded-xl border border-outline-variant bg-surface peer-checked:border-primary peer-checked:bg-secondary-container peer-checked:text-on-secondary-container text-on-surface-variant transition-colors">
<span class="material-symbols-outlined mb-2 text-[32px]">domain</span>
<span class="font-label-md text-label-md">Duplex</span>
</div>
</label>
<label class="cursor-pointer">
<input class="peer sr-only" name="property_type" type="radio" value="bungalow"/>
<div class="flex flex-col items-center justify-center p-4 rounded-xl border border-outline-variant bg-surface peer-checked:border-primary peer-checked:bg-secondary-container peer-checked:text-on-secondary-container text-on-surface-variant transition-colors">
<span class="material-symbols-outlined mb-2 text-[32px]">house</span>
<span class="font-label-md text-label-md">Bungalow</span>
</div>
</label>
<label class="cursor-pointer">
<input class="peer sr-only" name="property_type" type="radio" value="commercial"/>
<div class="flex flex-col items-center justify-center p-4 rounded-xl border border-outline-variant bg-surface peer-checked:border-primary peer-checked:bg-secondary-container peer-checked:text-on-secondary-container text-on-surface-variant transition-colors">
<span class="material-symbols-outlined mb-2 text-[32px]">store</span>
<span class="font-label-md text-label-md">Commercial</span>
</div>
</label>
</div>
</div>
<!-- Beds & Baths -->
<div class="grid grid-cols-2 gap-stack-md">
<div class="flex flex-col gap-stack-sm">
<label class="font-label-md text-label-md text-on-surface" for="bedrooms">Bedrooms</label>
<div class="flex items-center gap-3 bg-surface border border-outline-variant rounded-lg p-3 custom-input transition-colors">
<span class="material-symbols-outlined text-on-surface-variant">bed</span>
<input class="w-full bg-transparent border-none p-0 focus:ring-0 font-body-md text-body-md placeholder:text-on-surface-variant/50 text-on-surface outline-none" id="bedrooms" min="0" placeholder="0" type="number"/>
</div>
</div>
<div class="flex flex-col gap-stack-sm">
<label class="font-label-md text-label-md text-on-surface" for="bathrooms">Bathrooms</label>
<div class="flex items-center gap-3 bg-surface border border-outline-variant rounded-lg p-3 custom-input transition-colors">
<span class="material-symbols-outlined text-on-surface-variant">shower</span>
<input class="w-full bg-transparent border-none p-0 focus:ring-0 font-body-md text-body-md placeholder:text-on-surface-variant/50 text-on-surface outline-none" id="bathrooms" min="0" placeholder="0" type="number"/>
</div>
</div>
</div>
</section>
</main>
<!-- Bottom Action Area -->
<div class="fixed bottom-0 left-0 w-full p-4 bg-background border-t border-surface-variant z-50">
<button class="w-full bg-primary text-on-primary py-4 rounded-xl font-label-md text-label-md shadow-lg flex items-center justify-center gap-2 hover:bg-surface-tint transition-colors active:scale-95">
            Save &amp; Continue
            <span class="material-symbols-outlined text-xl">arrow_forward</span>
</button>
</div>
</body></html>
